# Fly.io worker scaffold — deploy only with `fly auth` + app create.
# Durable worker MUST run outside Vercel serverless.

app = "leadorbit-worker"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  LEADORBIT_ENV = "production"
  WORKER_HEALTH_PORT = "43128"
  WORKER_POLL_MS = "250"

[http_service]
  internal_port = 43128
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
