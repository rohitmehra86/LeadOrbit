server:
  port: ${PORT:43127}

spring:
  application:
    name: leadorbit
  profiles:
    default: local
  thymeleaf:
    cache: false

leadorbit:
  app-url: ${APP_URL:${NEXT_PUBLIC_APP_URL:http://127.0.0.1:43127}}
  supabase:
    url: ${SUPABASE_URL:https://kqmuxocbmtydkxdvmypy.supabase.co}
    anon-key: ${SUPABASE_ANON_KEY:}
    project-ref: ${SUPABASE_PROJECT_REF:kqmuxocbmtydkxdvmypy}
  meta:
    app-id: ${META_ADS_APP_ID:}
    app-secret: ${META_ADS_APP_SECRET:}
    login-config-id: ${META_ADS_LOGIN_CONFIG_ID:}
    oauth-redirect-uri: ${META_ADS_OAUTH_REDIRECT_URI:}
    allow-env-fallback: ${META_ADS_ALLOW_ENV_FALLBACK:false}
    access-token: ${META_ADS_ACCESS_TOKEN:}
    ad-account-id: ${META_ADS_AD_ACCOUNT_ID:}
    page-id: ${META_ADS_PAGE_ID:}
    pixel-id: ${META_ADS_PIXEL_ID:}
    lead-gen-form-id: ${META_ADS_LEAD_GEN_FORM_ID:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.leadorbit: INFO

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./.data/leadorbit;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  h2:
    console:
      enabled: true
      path: /h2

---
# Supabase via pooler (IPv4-friendly for Render free). Prefer:
# DATABASE_URL=jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
# DATABASE_USERNAME=postgres.kqmuxocbmtydkxdvmypy
spring:
  config:
    activate:
      on-profile: supabase
  autoconfigure:
    # Custom DataSourceConfig builds Hikari from DATABASE_URL (pooler / postgres:// safe)
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  datasource:
    url: ${DATABASE_URL:}
    username: ${DATABASE_USERNAME:postgres.kqmuxocbmtydkxdvmypy}
    password: ${DATABASE_PASSWORD:}
  sql:
    init:
      mode: never
  main:
    banner-mode: "off"
