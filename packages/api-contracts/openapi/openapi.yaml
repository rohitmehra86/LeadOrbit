openapi: 3.1.0
info:
  title: LeadOrbit API
  version: 0.2.0
  description: |
    Contract-first API for LeadOrbit. Milestone 2 adds auth session, orgs, invites,
    flags, entitlements stubs, audit, and platform admin listing.
servers:
  - url: /api/v1
tags:
  - name: Health
  - name: Auth
  - name: Tenancy
  - name: Platform
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      responses:
        "200":
          description: Service is up
  /auth/signup:
    post:
      tags: [Auth]
      operationId: signUp
      summary: Local-mode sign-up (Supabase path uses client SDK)
      responses:
        "201":
          description: Created session
        "501":
          description: Use Supabase client when AUTH_MODE=supabase
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      responses:
        "200":
          description: Session established
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      responses:
        "200":
          description: Signed out
  /auth/session:
    get:
      tags: [Auth]
      operationId: getSession
      responses:
        "200":
          description: Current session
        "401":
          description: No session
  /orgs:
    get:
      tags: [Tenancy]
      operationId: listOrgs
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Organizations for the user
        "401":
          description: Unauthorized
    post:
      tags: [Tenancy]
      operationId: createOrg
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /orgs/{orgId}:
    get:
      tags: [Tenancy]
      operationId: getOrg
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: Organization
        "403":
          description: Cross-tenant forbidden
    patch:
      tags: [Tenancy]
      operationId: updateOrgSettings
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: Updated
  /orgs/{orgId}/members:
    get:
      tags: [Tenancy]
      operationId: listMembers
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: Members
  /orgs/{orgId}/invites:
    post:
      tags: [Tenancy]
      operationId: createInvite
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "201":
          description: Invite created (token returned once)
  /invites/accept:
    post:
      tags: [Tenancy]
      operationId: acceptInvite
      responses:
        "200":
          description: Membership created
  /orgs/{orgId}/flags:
    get:
      tags: [Tenancy]
      operationId: listFlags
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: Feature flags
    put:
      tags: [Tenancy]
      operationId: setFlag
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: Flag upserted
  /orgs/{orgId}/billing:
    get:
      tags: [Tenancy]
      operationId: getBillingScaffold
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: Entitlements + quotas stubs
  /orgs/{orgId}/audit:
    get:
      tags: [Tenancy]
      operationId: listAudit
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: Audit trail
  /platform/orgs:
    get:
      tags: [Platform]
      operationId: listAllOrgsPlatform
      responses:
        "200":
          description: All tenants (platform admin)
        "403":
          description: Not a platform admin
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    orgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
