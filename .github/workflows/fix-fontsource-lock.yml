name: Fix fontsource lockfile
on:
  push:
    paths:
      - ".github/workflows/fix-fontsource-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild exact pnpm-lock.yaml
        run: |
          python3 <<'PY'
          from pathlib import Path
          from urllib.request import urlopen

          old = urlopen(
              "https://raw.githubusercontent.com/rohitmehra86/LeadOrbit/"
              "3f1c4e9e9471194d6a7678d0b69ce64fbade471b/pnpm-lock.yaml"
          ).read().decode()

          insert1 = chr(10).join([
              "      '@fontsource/ibm-plex-mono':",
              "        specifier: ^5.3.0",
              "        version: 5.3.0",
              "      '@fontsource/ibm-plex-sans':",
              "        specifier: ^5.3.0",
              "        version: 5.3.0",
              "      '@fontsource/source-serif-4':",
              "        specifier: ^5.3.1",
              "        version: 5.3.1",
          ]) + chr(10)
          insert2 = chr(10).join([
              "  '@fontsource/ibm-plex-mono@5.3.0':",
              "    resolution: {integrity: sha512-eTgnZjZEGk1QtD3ZstF+Vclo2HLAni8YMy34/DxllwZvyz1lR/1RF/xTiAquOBO7MvqBx8D2Ig2WCPMVfdZu7Q==}",
              "",
              "  '@fontsource/ibm-plex-sans@5.3.0':",
              "    resolution: {integrity: sha512-CbE4CbbEEZJX860XyUiRpsksXIQR8Rp2XDva2VO53NJox9tVNtusrysd2x5YkUEY3ErQ66W1IiiQL8/wihhw5w==}",
              "",
              "  '@fontsource/source-serif-4@5.3.1':",
              "    resolution: {integrity: sha512-cWcTCXjYYrgF9A67fThVir1VSc0lPEYmwQ6jA4pPt01s2MSCi/maINUcZoCzaqnU8fyUReDO97eGcBUkHgOeug==}",
              "",
          ]) + chr(10)
          insert3 = chr(10).join([
              "  '@fontsource/ibm-plex-mono@5.3.0': {}",
              "",
              "  '@fontsource/ibm-plex-sans@5.3.0': {}",
              "",
              "  '@fontsource/source-serif-4@5.3.1': {}",
              "",
          ]) + chr(10)

          t = old
          a1 = "  apps/web:" + chr(10) + "    dependencies:" + chr(10)
          t = t.replace(a1, a1 + insert1, 1)
          a2 = "  '@humanfs/core@0.19.2':" + chr(10) + "    resolution: {integrity: sha512-UhXNm+"
          i2 = t.find(a2)
          assert i2 >= 0, "anchor2"
          t = t[:i2] + insert2 + t[i2:]
          a3 = "  '@humanfs/core@0.19.2':" + chr(10) + "    dependencies:"
          i3 = t.find(a3)
          assert i3 >= 0, "anchor3"
          t = t[:i3] + insert3 + t[i3:]
          Path("pnpm-lock.yaml").write_text(t)
          assert "@fontsource/source-serif-4" in t
          print("wrote", len(t))
          PY

      - name: Commit and push lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No lockfile changes"
            exit 0
          fi
          git commit -m "Complete fontsource migration: pnpm lockfile"
          git push
