name: Fix fontsource lockfile
on:
  push:
    paths:
      - ".github/workflows/fix-fontsource-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Regenerate lockfile from package.json fontsource deps
        run: |
          # Current lockfile on main is corrupted; seed from last good revision
          curl -fsSL -o pnpm-lock.yaml \
            "https://raw.githubusercontent.com/rohitmehra86/LeadOrbit/3f1c4e9e9471194d6a7678d0b69ce64fbade471b/pnpm-lock.yaml"
          pnpm install --no-frozen-lockfile --lockfile-only
          grep -q '@fontsource/source-serif-4' pnpm-lock.yaml

      - name: Commit and push lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No lockfile changes"
            exit 0
          fi
          git commit -m "Complete fontsource migration: pnpm lockfile"
          git push
